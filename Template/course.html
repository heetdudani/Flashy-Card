{% extends "base.html" %}
{% load static %}
{% block main %}
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
      <!-- Course Collection Section -->
      <div class="mb-12">
        <h2 class="text-3xl font-bold text-gray-900 mb-8 text-center">
          Explore Our Courses
        </h2>
        <div
          class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
        >
          <!-- Course Card 1 (Adapted from Deck 1) -->
           {% for i in list  %}
          <div
            class="bg-white overflow-hidden shadow rounded-lg hover:shadow-lg transition duration-300"
          >
            <div class="px-4 py-5 sm:p-6">
              <div class="flex items-center">
                 <div class="flex-shrink-0 bg-indigo-500 rounded-md p-1 ">
                    <img class='h-9 w-9  ' src="{{i.logo.url}}" alt="">
                  </div>
                <div class="ml-5 w-0 flex-1">
                  <dt class="text-sm font-medium text-gray-500 truncate">
                    {{i.Course_Title}}
                  </dt>
                  <dd class="flex items-baseline">
                    <div class="text-2xl font-semibold text-gray-900">
                      {{i.Course_syllabus}}
                    </div>
                  </dd>
                </div>
              </div>
              <div class="mt-4">
                <p class="text-sm text-gray-600 mb-2">
                  {{i.course_intro}}
                </p>
                <div class="flex justify-between text-sm text-gray-500">
                  <span>{{i.Course_level}}</span>
                  <span>{{i.Course_time}}</span>
                </div>
                <a
                  href="../course_detail/{{i.Course_Title}}"
                  class="mt-4 w-full flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none"
                >
                  View Course
                </a>
              </div>
            </div>
          </div>
            {% endfor %}
          
        </div>
      </div>
    </main>

   {% endblock main%}
